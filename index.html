<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融学 &amp; 证券投资学 · 可交互案例知识库</title>
<style>
:root{
  --bg:#f5f8fc; --card:#ffffff; --ink:#1c2b3a; --ink2:#5c6f86; --ink3:#8a99ab;
  --line:#e6edf5; --line2:#f0f5fa;
  --primary:#2563eb; --primary-soft:#eaf1fe; --primary-dark:#1d4ed8;
  --gold:#a8791a; --gold-soft:#fdf7e6; --gold-line:#f0dfae;
  --jiu:#c2410c; --jiu-soft:#fff2ea;
  --food:#15803d; --food-soft:#e9f7ee;
  --ai:#7c3aed; --ai-soft:#f4ecfe;
  --ref:#64748b; --ref-soft:#f1f5f9;
  --shadow:0 1px 2px rgba(16,40,80,.04),0 8px 24px rgba(16,40,80,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
::selection{background:#cfe0ff}

/* ---------- Header ---------- */
header{
  position:fixed; top:0; left:0; right:0; height:64px; z-index:50;
  background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; padding:0 22px;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .logo{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,#2563eb,#4f8cff);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 4px 12px rgba(37,99,235,.35)
}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:.3px}
.search{flex:1;max-width:420px;position:relative}
.search input{
  width:100%;height:40px;border:1px solid var(--line);border-radius:10px;
  padding:0 14px 0 38px;font-size:14px;background:#f8fafd;color:var(--ink);outline:none;
  transition:.18s;font-family:inherit
}
.search input:focus{background:#fff;border-color:#a9c6f8;box-shadow:0 0 0 3px var(--primary-soft)}
.search svg{position:absolute;left:12px;top:11px;opacity:.45}
.header-meta{font-size:12px;color:var(--ink3);white-space:nowrap}
@media(max-width:900px){.header-meta{display:none}}

/* ---------- Layout ---------- */
.layout{display:flex;padding-top:64px;min-height:100vh}
aside{
  width:274px;flex:0 0 274px;position:fixed;top:64px;bottom:0;left:0;
  background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px 60px
}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:#dde6f0;border-radius:8px}
main{margin-left:274px;flex:1;padding:30px 40px 90px;max-width:1180px}
@media(max-width:900px){
  aside{position:static;width:100%;flex:none;border-right:none;border-bottom:1px solid var(--line);max-height:none;height:auto}
  .layout{flex-direction:column}
  main{margin-left:0;padding:22px 16px 70px}
}

/* ---------- Sidebar ---------- */
.nav-group{margin-bottom:14px}
.nav-title{
  font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1.2px;
  padding:9px 10px 6px;text-transform:uppercase
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  cursor:pointer;color:var(--ink2);font-size:13.5px;transition:.14s;border:1px solid transparent
}
.nav-item:hover{background:var(--line2);color:var(--ink)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600;border-color:#d5e4fd}
.nav-item .idx{
  width:21px;height:21px;flex:0 0 21px;border-radius:6px;background:var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--ink3)
}
.nav-item.active .idx{background:var(--primary);color:#fff}
.nav-item .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:transparent}
.nav-item.read .dot{background:#34d399}

/* ---------- Home ---------- */
.hero{
  background:linear-gradient(135deg,#ffffff 0%,#f2f7ff 100%);
  border:1px solid var(--line);border-radius:var(--radius);padding:30px 32px;box-shadow:var(--shadow);margin-bottom:22px
}
.hero h1{font-size:25px;letter-spacing:.5px;margin-bottom:6px}
.hero .sub{color:var(--ink2);font-size:14px;margin-bottom:18px}
.hero .qline{
  background:#fff;border:1px solid var(--line);border-left:3px solid var(--primary);
  border-radius:8px;padding:12px 16px;font-size:13.5px;color:var(--ink2);margin-top:8px
}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.pill{
  font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--ink2)
}
.section-head{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px}
.section-head h2{font-size:18px}
.section-head .hint{font-size:12.5px;color:var(--ink3)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mini-card{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 17px;cursor:pointer;transition:.16s
}
.mini-card:hover{border-color:#bcd4fb;transform:translateY(-2px);box-shadow:var(--shadow)}
.mini-card .mc-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mini-card .mc-num{
  width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center
}
.mini-card h3{font-size:14.5px}
.mini-card p{font-size:12.5px;color:var(--ink2);line-height:1.6}

/* ---------- Concept page ---------- */
.crumb{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.crumb b{color:var(--ink2);font-weight:600}
.concept-head{margin-bottom:20px}
.concept-head .num-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--primary-dark);
  background:var(--primary-soft);padding:3px 10px;border-radius:20px;margin-bottom:10px
}
.concept-head h1{font-size:27px;letter-spacing:.5px;margin-bottom:8px}
.concept-head .oneline{color:var(--ink2);font-size:14.5px}

.block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.block-head{
  display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line2);
  font-weight:700;font-size:14.5px
}
.block-head .sop-tag{
  font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary-dark);
  padding:2px 8px;border-radius:6px;letter-spacing:.5px
}
.block-body{padding:18px 20px}
.def-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.def-grid{grid-template-columns:1fr}}
.def-box{border-radius:11px;padding:14px 16px;border:1px solid var(--line2)}
.def-box.std{background:#f7fAff;border-color:#dce9fd}
.def-box.plain{background:#fbfdf9;border-color:#e3f2e6}
.def-box .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;margin-bottom:7px;color:var(--ink3)}
.def-box.std .lbl{color:var(--primary-dark)}
.def-box.plain .lbl{color:var(--food)}
.def-box .txt{font-size:14px;line-height:1.78;color:var(--ink)}
.logic-strip{
  margin-top:16px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:11px;
  padding:13px 16px;font-size:13.5px;color:#6b5210;display:flex;gap:10px;align-items:flex-start
}
.logic-strip .ic{font-size:16px;line-height:1.4}

/* ---------- Case accordion ---------- */
.industry-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-酒企{background:var(--jiu-soft);color:var(--jiu)}
.b-食品{background:var(--food-soft);color:var(--food)}
.b-AI{background:var(--ai-soft);color:var(--ai)}
.b-对照{background:var(--ref-soft);color:var(--ref)}
.case{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden;transition:.15s;background:#fff}
.case:hover{border-color:#c9dcf9}
.case.open{border-color:#bcd4fb;box-shadow:0 4px 16px rgba(37,99,235,.07)}
.case-sum{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;user-select:none}
.case-sum .co{font-weight:600;font-size:14.5px}
.case-sum .ch{font-size:12px;color:var(--ink3)}
.case-sum .chev{margin-left:auto;color:var(--ink3);transition:.2s;font-size:12px}
.case.open .chev{transform:rotate(90deg);color:var(--primary)}
.case-body{display:none;padding:2px 17px 17px;border-top:1px solid var(--line2)}
.case.open .case-body{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.field{margin-top:15px}
.field .fh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:6px}
.field .fh .n{
  width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:var(--primary-soft);color:var(--primary-dark)
}
.field .ft{font-size:13.8px;color:var(--ink);line-height:1.78}
.field.why .fh .n{background:var(--gold-soft);color:var(--gold)}
.field.logic .fh .n{background:var(--ai-soft);color:var(--ai)}

/* money flow */
.flow{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:#f7fAff;border:1px dashed #cfdffb;border-radius:10px;padding:13px 14px;margin-top:4px
}
.flow .node{
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.4
}
.flow .node small{display:block;font-weight:400;font-size:10.5px;color:var(--ink3)}
.flow .node.from{border-color:#f6c9b0;background:#fff7f2}
.flow .node.via{border-color:#c9dcf9;background:#f5f9ff}
.flow .node.to{border-color:#c8e9d2;background:#f4fcf6}
.flow .arw{color:var(--primary);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1}
.flow .arw small{font-weight:400;font-size:10px;color:var(--ink3);max-width:96px;text-align:center;margin-top:2px}

.empty{text-align:center;color:var(--ink3);padding:60px 20px;font-size:14px}
.top-btn{
  position:fixed;right:26px;bottom:26px;width:44px;height:44px;border-radius:50%;background:#fff;
  border:1px solid var(--line);box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink2);z-index:40
}
.top-btn:hover{color:var(--primary);border-color:#bcd4fb}
footer{margin-left:274px;padding:22px 40px 40px;color:var(--ink3);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:900px){footer{margin-left:0;padding:20px 16px 40px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">金</div>
    <div>金融学 &amp; 证券投资学<small>可交互案例知识库</small></div>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="搜索概念、公司、关键词…（如 茅台 / 估值 / 外汇）">
  </div>
  <div class="header-meta" id="meta"></div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<footer>内容基于《金融学 &amp; 证券投资学入门知识框架》整理，案例为公开信息 + 教学化解读，数字均为约数，仅供学习参考，不构成投资建议。</footer>
<div class="top-btn" id="topBtn" onclick="window.scrollTo({top:0})">↑</div>

<script>
/* ============================================================
   数据区：21 个概念 + PE/PB/ROE，按 SOP 七项组织
   每个概念 3~4 个真实案例（酒企 / 食品 / AI / 经典对照）
   ============================================================ */
const CATS = [
  {id:'c1', name:'一、金融是什么', desc:'钱的系统怎么运转：配置、市场、机构、融资方式'},
  {id:'c2', name:'二、为什么能运行', desc:'货币、利率、时间价值、风险与收益'},
  {id:'c3', name:'三、买什么 · 值多少钱', desc:'股票 / 债券 / 基金 / 估值'},
  {id:'c4', name:'四、估值三指标', desc:'PE / PB / ROE 各自回答什么问题'},
  {id:'c5', name:'五、收益 · 风险 · 怎么投', desc:'收益率、风险、资产配置、投资组合、分散化'}
];

const CONCEPTS = [
/* ============ 一、金融是什么 ============ */
{
  id:'allocation', num:1, cat:'c1', name:'资金配置',
  oneline:'把合适的钱，放到合适的地方。',
  def:'将有限的资金通过金融市场和金融机构，引导至不同的企业、行业和项目，提高资金配置效率。',
  plain:'简单说，就是“把合适的钱放到合适的地方”。这里的“配置效率”关注的是钱流向哪里是否合理，而不是单纯看钱流得快不快。',
  logic:'配置关注“钱往哪里去”。核心不是让钱流动起来，而是让钱流向回报更高、更值得投入的地方。',
  cases:[
    {i:'酒企', co:'贵州茅台', t:'出资百亿设立两只产业发展基金',
     a:'2023年5月，贵州茅台公告拟以自有资金认缴出资100亿元，参与设立茅台招华、茅台金石两只产业发展基金，把公司账上长期闲置的巨额现金投向更广的产业领域。',
     f:{from:'贵州茅台（出资人/LP）',via:'产业基金管理人（GP）',to:'被投企业 / 产业项目',note:'认缴合计约100亿元，约等于其一年多的净利润'},
     w:'茅台主业受产能与渠道限制，增长天花板渐显，而账上常年趴着上千亿现金，只能拿很低的存款利息。与其让钱“睡觉”，不如配置出去换更高回报，同时借道基金为未来的产业布局探路。',
     l:'这是最典型的资金配置：把回报率偏低的闲置资金，配置到风险可承受、回报更高的资产上，提升整体资本效率。企业从“只做经营”走向“经营 + 资本运营”。'},
    {i:'食品', co:'伊利股份', t:'把利润持续投向产业链上游奶源',
     a:'伊利多年把经营现金流投入上游牧场建设与并购（如收购新西兰 Westland 乳业等），把资金配置到奶源这一“卡脖子”环节。',
     f:{from:'伊利（经营现金流）',via:'自建牧场 / 并购',to:'上游奶源资产',note:'围绕保障供应、锁定成本'},
     w:'奶源是乳业命脉，一旦被上游掐住，利润和议价权都会受损。把资金配置到上游，是用资本换“供应链安全”。',
     l:'资金配置不只看财务回报率，也看战略回报：把资源投向最能决定长期竞争力的环节。'},
    {i:'AI', co:'微软', t:'重金投入 OpenAI，买下 AI 时代的入场券',
     a:'微软自2019年起分多轮向 OpenAI 投入资金，累计规模达上百亿美元，换来股权与深度合作（含算力供应与产品集成）。',
     f:{from:'微软（自有现金）',via:'股权投资 + 云算力协议',to:'OpenAI',note:'累计投入约130亿美元'},
     w:'微软判断生成式 AI 是下一个时代的操作系统级机会，与其自己从零追赶，不如用现金直接配置到最领先的团队。',
     l:'资金配置到高成长、高不确定性的前沿领域，用“一部分现金”换取“一个可能性极大的未来”。风险高，但潜在回报也极高。'},
    {i:'对照', co:'伯克希尔·哈撒韦', t:'长期留大量现金，等待“击球区”',
     a:'巴菲特旗下的伯克希尔长期保留数千亿美元现金与短债，不做满仓投资，只在价格合适时才出手。',
     f:{from:'伯克希尔（现金储备）',via:'货币市场 / 短期国债',to:'等待低估资产',note:'现金本身也是一种配置'},
     w:'没有好机会时，持有现金等于是持有一份“随时可以出手的期权”，避免被迫在错误的价格买入。',
     l:'资金配置的对立面不是“不配置”，而是“不配置也是配置”——在找不到好标的时，现金是最好的仓位。'}
  ],
},
{
  id:'market', num:2, cat:'c1', name:'金融市场',
  oneline:'不只是交易的地方，更是给资产定价的地方。',
  def:'金融市场是资金供求双方进行金融资产交易、资金融通和价格发现的市场。',
  plain:'就是钱和金融产品进行交易、交换和定价的地方。股票市场、债券市场、外汇市场等都属于金融市场的重要组成部分。',
  logic:'金融市场最重要的隐藏功能是“价格发现”——通过买卖双方的博弈，给资产形成一个公开的价格。',
  cases:[
    {i:'酒企', co:'贵州茅台', t:'2001年登陆上交所，从酒厂变成公众公司',
     a:'2001年8月，贵州茅台在上交所发行上市，向公众募集资金用于扩产和技术改造。',
     f:{from:'社会投资者（打新股）',via:'上交所（交易场所）',to:'贵州茅台（募资方）',note:'募资约20亿元级'},
     w:'酒厂要扩产能、建窖池需要大笔长期资金，靠自身利润积累慢，靠银行贷款则财务压力大。上市能一次性拿到资本金，且不用还本。',
     l:'金融市场让企业和投资者“直接碰面”：企业拿到钱，投资者拿到股份，市场同时通过连续交易给茅台定出每天的价格。'},
    {i:'食品', co:'农夫山泉', t:'2020年港股上市，“大自然的搬运工”登陆资本市场',
     a:'2020年9月，农夫山泉在港交所上市，募资约81.5亿港元，用于产能扩张与品牌建设。',
     f:{from:'全球投资者',via:'港交所',to:'农夫山泉',note:'募资约81.5亿港元'},
     w:'公司要持续扩张水源地和渠道，需要外部资本；上市也能让创始人股权获得公开市场定价、方便后续运作。',
     l:'港股是国际化的金融市场，同一家公司在这里能被全球资金定价，价格里包含了国际投资者对中国消费的预期。'},
    {i:'AI', co:'商汤科技', t:'2021年港股上市，AI 公司走向公开市场',
     a:'2021年12月，商汤科技在港交所上市，募资约57.5亿港元，成为当时港股 AI 第一股。',

const INDUSTRIES = [
  {k:'all', label:'全部行业'},

let state = {view:'home', industry:'all', query:''};
let READ = new Set(JSON.parse(localStorage.getItem('fin_read')||'[]'));

function saveRead(){ localStorage.setItem('fin_read', JSON.stringify([...READ])); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderSidebar(){
  const side = document.getElementById('sidebar');
  let html = '';
  html += `<div class="nav-group">`;
  html += `<div class="nav-item ${state.view==='home'?'active':''}" onclick="go('home')"><span class="idx">≡</span>知识库首页</div>`;
  html += `</div>`;
  CATS.forEach(c=>{
    const items = CONCEPTS.filter(x=>x.cat===c.id);
    html += `<div class="nav-group"><div class="nav-title">${c.name}</div>`;
    items.forEach(x=>{
      html += `<div class="nav-item ${state.view===x.id?'active':''} ${READ.has(x.id)?'read':''}" onclick="go('${x.id}')">
        <span class="idx">${x.num}</span>${x.name}<span class="dot"></span></div>`;
    });
    html += `</div>`;
  });
  side.innerHTML = html;
}

function go(v){ state.view=v; if(location.hash.slice(1)!==v) location.hash=v; window.scrollTo({top:0}); render(); }
window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1)||'home'; if(v!==state.view){ state.view=v; window.scrollTo({top:0}); render(); } });

function render(){
  renderSidebar();
  const main = document.getElementById('main');
  const q = state.query.trim();
  if(q){ main.innerHTML = renderSearch(q); }
  else if(state.view==='home'){ main.innerHTML = renderHome(); }
  else { main.innerHTML = renderConcept(state.view); }
  document.getElementById('meta').textContent = `${CONCEPTS.length} 个概念 · 已掌握 ${READ.size}`;
  document.getElementById('topBtn').style.display = 'flex';
}

function matches(x,q){
  if(!q) return true;
  q = q.toLowerCase();
  const hay = [x.name, x.oneline, x.def, x.plain, x.logic, ...x.cases.map(c=>c.co+c.t+c.a+c.w+c.l)].join(' ').toLowerCase();
  return hay.includes(q);
}

function renderSearch(q){
  const hit = CONCEPTS.filter(x=>matches(x,q));
  if(!hit.length) return `<div class="empty">没有找到与「${esc(q)}」相关的内容，换个关键词试试（如 茅台 / 估值 / 外汇）。</div>`;
  return `<div class="crumb">搜索 <b>「${esc(q)}」</b> · 命中 ${hit.length} 个概念</div>
  <div class="cards-grid">${hit.map(miniCard).join('')}</div>`;
}

function miniCard(x){
  const stage = CATS.find(c=>c.id===x.cat).name;
  return `<div class="mini-card" onclick="go('${x.id}')">
    <div class="mc-top"><span class="mc-num">${x.num}</span><h3>${x.name}</h3></div>
    <p>${esc(x.oneline)}</p>
    <p style="color:#8a99ab;font-size:11.5px;margin-top:7px">${stage}</p>
  </div>`;
}

  let html = `<div class="hero">
    <h1>金融学 &amp; 证券投资学 · 可交互案例知识库</h1>
    <div class="sub">把《入门框架》里的每一个概念，变成“标准定义 + 大白话 + 真实商业案例”。</div>
    <div class="qline">金融学看的是<b>“整个钱的系统怎么运转”</b>；证券投资学看的是<b>“投资者怎么判断价值、风险和收益，并做投资决策”</b>。</div>
    <div class="pill-row">
      <span class="pill">📖 24 个概念</span>
      <span class="pill">🏭 酒企 / 食品 / AI 真实案例</span>
      <span class="pill">🧭 SOP 六步拆解</span>
    </div>
  </div>`;
  CATS.forEach(c=>{
    const items = CONCEPTS.filter(x=>x.cat===c.id);
    html += `<div class="section-head"><h2>${c.name}</h2><span class="hint">${c.desc}</span></div>`;
    html += `<div class="cards-grid">${items.map(miniCard).join('')}</div>`;
  });
  return html;
}

function renderConcept(id){
  const x = CONCEPTS.find(c=>c.id===id);
  const stage = CATS.find(c=>c.id===x.cat).name;
  let cases = x.cases.filter(c=> state.industry==='all' || c.i===state.industry);
  let html = `<div class="crumb">${stage} · <b>${x.name}</b></div>
  <div class="concept-head">
    <span class="num-tag">◈ 概念 ${x.num}</span>
    <h1>${x.name}</h1>
    <div class="oneline">${esc(x.oneline)}</div>
  </div>`;

  // 定义块
  html += `<div class="block">
    <div class="block-head"><span class="sop-tag">①②</span>定义与白话</div>
    <div class="block-body">
      <div class="def-grid">
        <div class="def-box std"><div class="lbl">① 金融学标准定义</div><div class="txt">${esc(x.def)}</div></div>
        <div class="def-box plain"><div class="lbl">② 大白话</div><div class="txt">${esc(x.plain)}</div></div>
      </div>
      <div class="logic-strip"><span class="ic">💡</span><span><b>核心逻辑：</b>${esc(x.logic)}</span></div>
    </div>
  </div>`;

  // 行业筛选
  html += `<div class="section-head"><h2>真实商业案例</h2><span class="hint">③ 商业动作 · ④ 钱的流向 · ⑤ 企业动机 · ⑥ 金融逻辑</span></div>
  <div class="pill-row" style="margin-bottom:14px">` +
    INDUSTRIES.map(ind=>{
      const n = ind.k==='all'? x.cases.length : x.cases.filter(c=>c.i===ind.k).length;
      if(ind.k!=='all' && n===0) return '';
      return `<span class="pill" style="cursor:pointer;${state.industry===ind.k?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" onclick="setInd('${ind.k}')">${ind.label}${ind.k!=='all'?' '+n:''}</span>`;
    }).join('') + `</div>`;

  if(!cases.length){
    html += `<div class="empty">该行业下暂无案例，切换其他行业看看。</div>`;
  } else {
    html += cases.map((c,idx)=>renderCase(c, idx===0)).join('');
  }

  html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px">
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer">
      <input type="checkbox" ${READ.has(x.id)?'checked':''} onchange="toggleRead('${x.id}')"> 标记为已掌握
    </label>
    ${nextPrev(x)}
  </div>`;

  return html;
}

function nextPrev(x){
  const i = CONCEPTS.findIndex(c=>c.id===x.id);
  const prev = CONCEPTS[i-1], next = CONCEPTS[i+1];
  return `<div style="display:flex;gap:8px">
    ${prev?`<button onclick="go('${prev.id}')" style="font-family:inherit;font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2)">← ${prev.name}</button>`:''}
    ${next?`<button onclick="go('${next.id}')" style="font-family:inherit;font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2)">${next.name} →</button>`:''}
  </div>`;
}

function renderCase(c, open){
  return `<div class="case ${open?'open':''}" onclick="this.classList.toggle('open')">
    <div class="case-sum">
      <span class="industry-badge b-${c.i}">${c.i}</span>
      <span class="co">${esc(c.co)}</span>
      <span class="ch">${esc(c.t)}</span>
      <span class="chev">▶</span>
    </div>
    <div class="case-body" onclick="event.stopPropagation()">
      <div class="field"><div class="fh"><span class="n">③</span>真实商业动作</div><div class="ft">${esc(c.a)}</div></div>
      <div class="field"><div class="fh"><span class="n">④</span>当时钱从谁手里到谁手里</div>
        <div class="flow">
          <span class="node from">${esc(c.f.from)}</span>
          <span class="arw">──▶<small>${esc(c.f.note)}</small></span>
          <span class="node via">${esc(c.f.via)}</span>
          <span class="arw">──▶</span>
          <span class="node to">${esc(c.f.to)}</span>
        </div>
      </div>
      <div class="field why"><div class="fh"><span class="n">⑤</span>企业为什么这么做</div><div class="ft">${esc(c.w)}</div></div>
      <div class="field logic"><div class="fh"><span class="n">⑥</span>体现了什么金融逻辑</div><div class="ft">${esc(c.l)}</div></div>
    </div>
  </div>`;
}

function setInd(k){ state.industry=k; render(); }
function toggleRead(id){
  if(READ.has(id)) READ.delete(id); else READ.add(id);
  saveRead(); renderSidebar();
  document.getElementById('meta').textContent = `${CONCEPTS.length} 个概念 · 已掌握 ${READ.size}`;
}

document.getElementById('search').addEventListener('input', e=>{
  state.query = e.target.value;
  render();
});

state.view = location.hash.slice(1) || 'home';
render();
</script>
</body>
</html>
